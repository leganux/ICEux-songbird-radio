services:
  app:
    build: .
    # Secondary group grants access only to Liquidsoap's private socket volume.
    user: "999:10001"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///./data/iceux.db
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      LIQUIDSOAP_HOST: liquidsoap
      LIQUIDSOAP_PORT: "1234"
      LIQUIDSOAP_SOCKET: /run/iceux/liquidsoap.sock
      S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-iceux-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-iceux-radio}
      S3_USE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - liquidsoap_control:/run/iceux
    depends_on:
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      liquidsoap:
        condition: service_started
    restart: unless-stopped

  liquidsoap:
    image: savonet/liquidsoap:v2.3.0
    environment:
      ICECAST_HOST: icecast
      ICECAST_PORT: "8000"
      ICECAST_MOUNT: /radio
      ICECAST_SOURCE_PASSWORD: ${ICECAST_PASSWORD:-change-me-source-password}
    command: ["/radio/radio.liq"]
    volumes:
      - ./liquidsoap/radio.liq:/radio/radio.liq:ro
      - ./data:/radio/data
      - ./app/static/basemusic:/radio/data/basemusic:ro
      - liquidsoap_control:/run/iceux
    depends_on:
      icecast:
        condition: service_started
      control-init:
        condition: service_completed_successfully
    restart: unless-stopped

  control-init:
    image: alpine:3.20
    # One-shot least-privilege preparation for Liquidsoap's private socket.
    command: ["sh", "-c", "chown 10000:10001 /run/iceux && chmod 0770 /run/iceux"]
    volumes:
      - liquidsoap_control:/run/iceux
    restart: "no"

  icecast:
    # The repository publishes `latest`; the former 2.4.4 tag was removed.
    image: infiniteproject/icecast:latest
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_PASSWORD:-change-me-source-password}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:-change-me-admin-password}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:-change-me-relay-password}
      ICECAST_HOSTNAME: ${ICECAST_PUBLIC_HOST:-localhost}
    ports:
      - "${ICECAST_PUBLIC_PORT:-8001}:8000"
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-iceux-admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio-secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-iceux-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-iceux-radio}
    depends_on:
      minio:
        condition: service_started
    entrypoint: >-
      /bin/sh -c "until mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY >/dev/null 2>&1; do sleep 2; done; mc mb --ignore-existing local/$$S3_BUCKET"
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  liquidsoap_control:
  minio_data:
  redis_data:
