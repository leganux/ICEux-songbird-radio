<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · ICEux</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"><link rel="stylesheet" href="/static/app.css"></head><body class="login-bg"><main class="login-card"><p class="eyebrow">ICEux Songbird Radio</p><h1>Control room</h1><p class="text-muted">Sign in to manage your station.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post"><label>Username</label><input class="form-control mb-3" name="username" required autofocus><label>Password</label><input class="form-control mb-4" name="password" type="password" required><button class="btn btn-primary btn-block">Enter station</button></form></main></body></html>
